<style>

:root{
--red:#E63946;
--yellow:#F4D35E;
--blue:#4EA8DE;
--green:#74C69D;
--bg:#FFFDF7;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:var(--bg);

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:25px;

}

.container{

width:100%;
max-width:1100px;

background:white;

border-radius:40px;

overflow:hidden;

display:flex;

box-shadow:
0 15px 35px rgba(0,0,0,.08);

animation:fade .8s;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}


/* LEFT */

.left{

flex:1;

background:
linear-gradient(
135deg,
var(--blue),
#7bc7f4
);

padding:60px;

color:white;

display:flex;
flex-direction:column;
justify-content:center;

}

.left h1{

font-size:48px;

margin:20px 0;

}

.left p{

line-height:1.8;

}

.panda{

font-size:120px;

margin-top:30px;

animation:float 4s infinite;

}

@keyframes float{

50%{
transform:translateY(-15px);
}

}


/* RIGHT */

.right{

flex:1;

padding:60px;

display:flex;
flex-direction:column;
justify-content:center;

}

.logo{

font-size:36px;

font-weight:700;

color:var(--red);

margin-bottom:10px;

}

.subtitle{

color:#777;

margin-bottom:35px;

}


.input-group{

margin-bottom:20px;

}

input{

width:100%;

padding:18px;

border:none;

border-radius:18px;

background:#f4f4f4;

font-size:16px;

}

input:focus{

outline:2px solid var(--blue);

}


.btn{

width:100%;

padding:16px;

border:none;

border-radius:40px;

cursor:pointer;

font-weight:600;

transition:.3s;

}

.signup{

background:var(--red);

color:white;

}

.signup:hover{

transform:translateY(-3px);

}


.bottom{

margin-top:25px;

text-align:center;

}

.bottom a{

color:var(--red);

text-decoration:none;

font-weight:600;

}


/* MOBILE */

@media(max-width:900px){

.container{

flex-direction:column;

}

.left,
.right{

padding:40px;

text-align:center;

}

}

</style>

</head>
<body>

<div class="container">

  <!-- LEFT PANEL -->
  <div class="left">
    <div class="tagline-pill"><span>✨</span> Mandarin Learning &amp; More</div>
    <h1>Join<br>Hanverse</h1>
    <p>Create your free account and start learning Mandarin through stories, games, and structured YCT lessons.</p>
    <div class="panda-hero" id="pandaHero">🐼</div>
  </div>

  <!-- RIGHT PANEL — form -->
  <div class="right">
    <div class="logo">
      <span class="logo-badge">🐼</span>
      Hanverse
    </div>
    <h2>Create Account</h2>
    <p class="subtitle">Start your Chinese learning journey — it's free!</p>

    <div class="err-bar" id="errorBar" role="alert"></div>

    <form id="signupForm" novalidate>
      <div class="f-row">
        <div class="field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Jane Doe" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="jane_doe" autocomplete="username" required>
        </div>
      </div>

      <div class="field" style="margin-bottom:16px;">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="jane@example.com" autocomplete="email" required>
      </div>

      <div class="f-row">
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="6+ characters" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm</label>
          <input type="password" id="confirmPassword" placeholder="Re-type" autocomplete="new-password" required>
        </div>
      </div>

      <button type="submit" class="btn-signup" id="signupBtn">Create Account</button>
    </form>

    <p class="already">Already have an account? <a href="login.html">Log in</a></p>

  </div>

</div>

    <script src="notifications.js"></script>
    <script>
        var SESSION_KEY = 'hanverse_user';
        var API_URL = '/api';

        function requireSession() {
            var raw = localStorage.getItem(SESSION_KEY);
            if (!raw) { window.location.href = 'login.html'; return null; }
            try { return JSON.parse(raw); } catch { window.location.href = 'login.html'; return null; }
        }

        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var fullName        = document.getElementById('fullName').value.trim();
            var username        = document.getElementById('username').value.trim();
            var email           = document.getElementById('email').value.trim();
            var password        = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var errorBar        = document.getElementById('errorBar');
            var btn             = document.getElementById('signupBtn');

            errorBar.className = 'err-bar';

            if (!fullName || !username || !email || !password || !confirmPassword) {
                errorBar.textContent = 'Please fill in all fields.';
                errorBar.className = 'err-bar show';
                Notify.toast('Please fill in all fields.', 'warn', 4000);
                return;
            }
            if (password.length < 6) {
                errorBar.textContent = 'Password must be at least 6 characters.';
                errorBar.className = 'err-bar show';
                Notify.toast('Password must be at least 6 characters.', 'warn', 4000);
                return;
            }
            if (password !== confirmPassword) {
                errorBar.textContent = 'Passwords do not match.';
                errorBar.className = 'err-bar show';
                Notify.toast('Passwords do not match.', 'warn', 4000);
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating account…';

            try {
                var response = await fetch(API_URL + '/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password, fullName: fullName, username: username })
                });

                var data = await response.json();

                if (!response.ok) {
                    errorBar.textContent = data.error || 'Signup failed. Please try again.';
                    errorBar.className = 'err-bar show';
                    Notify.toast(data.error || 'Signup failed. Please try again.', 'error', 4000);
                    btn.disabled = false;
                    btn.textContent = 'Create Account';
                    return;
                }

                if (data.success) {
                    Notify.toast('Account created successfully! Welcome to Hanverse! 🎉', 'success', 4000);
                    Notify.miniConfetti();

                    // Store signed-up user in session
                    if (data.user) {
                        localStorage.setItem(SESSION_KEY, JSON.stringify({
                            user_id:   data.user.user_id,
                            username:  data.user.username,
                            fullName:  data.user.full_name,
                            email:     data.user.email,
                            xp:        data.user.xp,
                            level:     data.user.level,
                            streak:    data.user.streak_days,
                        }));
                    }

                    // Navigate to profile after brief celebration
                    setTimeout(function() {
                        window.location.href = 'profile.html';
                    }, 2000);
                }

            } catch (err) {
                console.error('Signup error:', err);
                errorBar.textContent = 'Connection error. Is the server running?';
                errorBar.className = 'err-bar show';
                Notify.toast('Connection error. Is the server running?', 'error', 5000);
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });

        // Panda hover delight
        document.addEventListener('DOMContentLoaded', function() {
            var panda = document.getElementById('pandaHero');
            if (panda) {
                panda.addEventListener('click', function() {
                    Notify.toast('Panda is excited to meet you! 🐼', 'heart', 2500);
                    Notify.showXP(10);
                });
            }

            window.addEventListener('load', function() {
                Notify.toast('Ready to create your account! Let\'s go! 🐼', 'star', 3000);
            });
        });
    </script>

</body>
</html>
