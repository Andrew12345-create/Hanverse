<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Hanverse Profile</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

/* ════════════════════════════════════
   ROOT
════════════════════════════════════ */

:root{

--bg:#FFF9F3;

--orange:#FFB703;
--red:#E63946;
--blue:#4EA8DE;
--green:#74C69D;
--purple:#9B5DE5;

--text:#1E293B;
--muted:#64748B;

}

/* ════════════════════════════════════
   GLOBAL
════════════════════════════════════ */

*{

margin:0;
padding:0;

box-sizing:border-box;

font-family:'Poppins',sans-serif;

}

body{

background:var(--bg);

color:var(--text);

overflow-x:hidden;

padding:30px;

}

/* BLOBS */

.blob{

position:fixed;

border-radius:50%;

filter:blur(90px);

opacity:.18;

z-index:-1;

animation:floatBlob 10s infinite ease-in-out;

}

.blob1{

width:320px;
height:320px;

background:var(--blue);

top:-120px;
left:-100px;

}

.blob2{

width:260px;
height:260px;

background:var(--purple);

right:-80px;
top:240px;

animation-delay:2s;

}

.blob3{

width:220px;
height:220px;

background:var(--orange);

bottom:-60px;
left:40%;

animation-delay:4s;

}

/* NAVBAR */

nav{

display:flex;
justify-content:space-between;
align-items:center;

padding:24px 30px;

background:white;

border-radius:34px;

margin-bottom:30px;

box-shadow:
0 15px 35px rgba(0,0,0,.06);

}

.logo{

display:flex;
align-items:center;
gap:14px;

font-size:34px;
font-weight:800;

color:var(--orange);

}

.logo-icon{

width:56px;
height:56px;

border-radius:20px;

background:#FFF4D6;

display:flex;
justify-content:center;
align-items:center;

font-size:28px;

}

nav ul{

display:flex;
gap:34px;

list-style:none;

}

nav a{

text-decoration:none;

font-weight:600;

color:#444;

transition:.3s;

}

nav a:hover,
nav a.active{

color:var(--red);

}

/* MAIN */

.layout{

display:grid;

grid-template-columns:
380px 1fr;

gap:30px;

}

/* PROFILE CARD */

.profile-card{

background:white;

padding:34px;

border-radius:40px;

box-shadow:
0 20px 50px rgba(0,0,0,.06);

position:sticky;
top:20px;

height:fit-content;

overflow:hidden;

}

.glow{

position:absolute;

width:180px;
height:180px;

border-radius:50%;

background:
rgba(78,168,222,.12);

top:-60px;
right:-40px;

}

.avatar-wrap{

display:flex;
flex-direction:column;
align-items:center;

text-align:center;

position:relative;

z-index:2;

}

.avatar{

width:130px;
height:130px;

border-radius:36px;

background:
linear-gradient(
135deg,
var(--blue),
var(--purple)
);

display:flex;
justify-content:center;
align-items:center;

font-size:60px;

color:white;

margin-bottom:20px;

}

.avatar img{

width:100%;
height:100%;

object-fit:cover;

border-radius:36px;

}

.name{

font-size:30px;

font-weight:700;

margin-bottom:8px;

}

.username{

color:var(--muted);

margin-bottom:16px;

}

.level{

background:var(--orange);

color:white;

padding:10px 18px;

border-radius:30px;

font-size:14px;
font-weight:700;

display:inline-block;

margin-bottom:14px;

}

.admin{

background:
linear-gradient(
135deg,
var(--red),
#FF6B6B
);

color:white;

padding:10px 18px;

border-radius:30px;

font-size:13px;
font-weight:700;

display:none;

}

/* XP */

.xp-section{

margin-top:30px;

}

.xp-top{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:12px;

font-weight:600;

}

.xp-bar{

height:16px;

background:#E5E7EB;

border-radius:30px;

overflow:hidden;

}

.xp-fill{

height:100%;

width:0%;

border-radius:30px;

background:
linear-gradient(
90deg,
var(--green),
var(--blue)
);

transition:1s;

}

/* STATS */

.stats{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:16px;

margin-top:28px;

}

.stat{

background:#F8FAFC;

padding:20px;

border-radius:24px;

text-align:center;

}

.stat h3{

font-size:30px;

color:var(--blue);

margin-bottom:6px;

}

.stat p{

font-size:13px;

font-weight:600;

color:var(--muted);

}

/* DASHBOARD */

.dashboard{

display:flex;
flex-direction:column;

gap:28px;

}

/* HERO */

.hero{

background:
linear-gradient(
135deg,
var(--blue),
#7FD0FF
);

padding:40px;

border-radius:40px;

color:white;

position:relative;

overflow:hidden;

}

.hero h1{

font-size:56px;

margin-bottom:16px;

}

.hero p{

line-height:1.9;

max-width:700px;

}

.circle{

position:absolute;

width:240px;
height:240px;

border-radius:50%;

background:
rgba(255,255,255,.12);

right:-70px;
top:-70px;

}

/* LESSONS */

.box{

background:white;

padding:34px;

border-radius:38px;

box-shadow:
0 14px 35px rgba(0,0,0,.06);

}

.section-title{

font-size:34px;

margin-bottom:24px;

}

.lesson-list{

display:flex;
flex-direction:column;

gap:18px;

}

.lesson{

background:#F8FAFC;

padding:20px;

border-radius:24px;

display:flex;
justify-content:space-between;
align-items:center;

}

.lesson-left{

display:flex;
align-items:center;
gap:16px;

}

.lesson-icon{

width:64px;
height:64px;

border-radius:22px;

display:flex;
justify-content:center;
align-items:center;

font-size:30px;

color:white;

}

.icon1{background:var(--green);}
.icon2{background:var(--purple);}
.icon3{background:var(--orange);}

.progress{

width:120px;

height:12px;

background:#E5E7EB;

border-radius:30px;

overflow:hidden;

margin-top:8px;

}

.fill{

height:100%;

border-radius:30px;

}

.fill1{width:100%;background:var(--green);}
.fill2{width:70%;background:var(--blue);}
.fill3{width:40%;background:var(--purple);}

/* LOADER */

.loader{

position:fixed;

inset:0;

background:white;

display:flex;
justify-content:center;
align-items:center;

z-index:99999;

flex-direction:column;

gap:20px;

}

.spinner{

width:70px;
height:70px;

border:8px solid #eee;

border-top:
8px solid var(--blue);

border-radius:50%;

animation:spin 1s linear infinite;

}

/* AI */

.ai-helper{

position:fixed;

bottom:24px;
right:24px;

background:white;

padding:14px 18px;

border-radius:26px;

display:flex;
gap:14px;

max-width:340px;

box-shadow:
0 18px 40px rgba(0,0,0,.14);

z-index:9999;

}

.ai-avatar{

width:54px;
height:54px;

border-radius:18px;

background:var(--blue);

display:flex;
justify-content:center;
align-items:center;

font-size:28px;

color:white;

}

/* ANIMATIONS */

@keyframes spin{

to{

transform:rotate(360deg);

}

}

@keyframes floatBlob{

50%{

transform:
translateY(-30px)
translateX(20px);

}

}

/* MOBILE */

@media(max-width:950px){

.layout{

grid-template-columns:1fr;

}

.profile-card{

position:relative;

}

nav ul{

display:none;

}

.hero h1{

font-size:42px;

}

}

</style>

</head>

<body>

<!-- LOADER -->

<div class="loader" id="loader">

<div class="spinner"></div>

<h2>

Loading Profile...

</h2>

</div>

<!-- BLOBS -->

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<!-- NAVBAR -->

<nav>

<div class="logo">

<div class="logo-icon">

🐼

</div>

Hanverse

</div>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="learn.html">Learn</a></li>
<li><a href="practice.html">Practice</a></li>
<li><a href="worksheets.html">Worksheets</a></li>
<li><a href="parents.html">Parents</a></li>
<li><a href="profile.html" class="active">Profile</a></li>
</ul>

</nav>

<!-- MAIN -->

<div class="layout">

<!-- PROFILE -->

<div class="profile-card">

<div class="glow"></div>

<div class="avatar-wrap">

<div class="avatar" id="avatar">

😊

</div>

<div class="name" id="name">

Loading...

</div>

<div class="username" id="username">

@loading

</div>

<div class="level" id="level">

Level 1

</div>

<div class="admin" id="adminTag">

🛡️ ADMIN

</div>

</div>

<div class="xp-section">

<div class="xp-top">

<span>

XP Progress

</span>

<span id="xpText">

0 / 1000 XP

</span>

</div>

<div class="xp-bar">

<div
class="xp-fill"
id="xpFill">

</div>

</div>

</div>

<div class="stats">

<div class="stat">

<h3 id="xpStat">

0

</h3>

<p>

XP

</p>

</div>

<div class="stat">

<h3 id="levelStat">

1

</h3>

<p>

Level

</p>

</div>

<div class="stat">

<h3 id="streakStat">

0

</h3>

<p>

Streak

</p>

</div>

<div class="stat">

<h3 id="lessonsStat">

0

</h3>

<p>

Lessons

</p>

</div>

</div>

</div>

<!-- DASHBOARD -->

<div class="dashboard">

<div class="hero">

<div class="circle"></div>

<h1 id="welcomeText">

Welcome Back 👋

</h1>

<p id="heroText">

Loading your progress...

</p>

</div>

<div class="box">

<h2 class="section-title">

Recent Lessons

</h2>

<div
class="lesson-list"
id="lessonList">

</div>

</div>

</div>

</div>

<!-- AI -->

<div class="ai-helper">

<div class="ai-avatar">

🤖

</div>

<div>

Your AI tutor is online 🚀

</div>

</div>

<script src="notifications.js"></script>
<script>
async function loadProfile() {
  const localUser = JSON.parse(localStorage.getItem('hanverse_user') || 'null');
  if (!localUser || !localUser.user_id) { window.location.href = 'login.html'; return; }

  try {
    const res  = await fetch(`/api/user/${localUser.user_id}`);
    const data = await res.json();
    if (!res.ok || !data.user) throw new Error(data.error || 'Failed');

    const u = data.user;
    const isAdmin = u.is_admin === true;

    // Update localStorage with fresh DB data
    localStorage.setItem('hanverse_user', JSON.stringify({ ...localUser, ...u, loggedIn: true }));

    // Name & username
    document.getElementById('name').textContent     = u.full_name || u.username || 'Learner';
    document.getElementById('username').textContent = '@' + (u.username || '');

    // Avatar
    if (u.profile_picture) {
      document.getElementById('avatar').innerHTML = `<img src="${u.profile_picture}" alt="avatar">`;
    }

    // Admin tag + max stats
    if (isAdmin) {
      document.getElementById('adminTag').style.display = 'inline-block';
      document.getElementById('level').innerHTML   = '&#128081; MAX LEVEL &bull; ADMIN';
      document.getElementById('xpText').textContent = '&#8734; MAX XP';
      document.getElementById('xpFill').style.width = '100%';
      document.getElementById('xpStat').textContent    = '&#8734;';
      document.getElementById('levelStat').textContent = 'MAX';
    } else {
      document.getElementById('level').textContent    = '⭐ Level ' + u.level;
      const xpForNext = u.level * 100;
      document.getElementById('xpText').textContent   = u.xp + ' / ' + xpForNext + ' XP';
      document.getElementById('xpFill').style.width   = Math.min((u.xp / xpForNext) * 100, 100) + '%';
      document.getElementById('xpStat').textContent   = u.xp;
      document.getElementById('levelStat').textContent = u.level;
    }

    document.getElementById('streakStat').textContent  = u.streak_days || 0;
    document.getElementById('lessonsStat').textContent = (data.progress || []).length;

    // Hero
    document.getElementById('welcomeText').textContent = 'Welcome Back, ' + (u.full_name || u.username) + ' 👋';
    document.getElementById('heroText').textContent    = isAdmin
      ? '🛡️ You have full admin access. Max XP and Level unlocked.'
      : 'You are Level ' + u.level + ' with ' + u.xp + ' XP. Keep going!';

    // Recent lessons from progress
    const lessonList = document.getElementById('lessonList');
    const progress   = data.progress || [];
    if (progress.length) {
      const icons = ['icon1','icon2','icon3'];
      lessonList.innerHTML = progress.slice(0, 5).map((p, i) => {
        const title = (p.course_type || 'YCT') + ' ' + (p.course_level || 1) + ' — Lesson ' + (p.lesson_id || i+1);
        const pct   = p.score || (p.completed ? 100 : 0);
        return `<div class="lesson">
          <div class="lesson-left">
            <div class="lesson-icon ${icons[i % 3]}">📚</div>
            <div>
              <h4>${title}</h4>
              <p>${pct}% complete</p>
              <div class="progress"><div class="fill fill1" style="width:${pct}%"></div></div>
            </div>
          </div>
          <div>⭐ ${p.score || 0} XP</div>
        </div>`;
      }).join('');
    } else {
      lessonList.innerHTML = '<p style="color:#888">No lessons completed yet. <a href="learn.html">Start learning!</a></p>';
    }

    // Notifications toast
    const unread = (data.notifications || []).filter(n => !n.is_read).length;
    if (unread > 0) Notify.toast(`You have ${unread} unread notification${unread > 1 ? 's' : ''} 🔔`, 'info', 3500);
    if (isAdmin) setTimeout(() => { Notify.toast('Admin access active 🛡️', 'star', 3000); Notify.miniConfetti(); }, 800);

  } catch (err) {
    console.error(err);
    Notify.toast('Could not load profile from DB — showing cached data', 'warn', 4000);
    // Fallback to localStorage
    const u = localUser;
    document.getElementById('name').textContent      = u.fullName || u.username || 'Learner';
    document.getElementById('username').textContent  = '@' + (u.username || '');
    document.getElementById('level').textContent     = '⭐ Level ' + (u.level || 1);
    document.getElementById('xpStat').textContent    = u.xp || 0;
    document.getElementById('levelStat').textContent = u.level || 1;
    document.getElementById('streakStat').textContent = u.streak || 0;
    document.getElementById('xpText').textContent    = (u.xp || 0) + ' XP';
    document.getElementById('xpFill').style.width    = Math.min(((u.xp||0) / ((u.level||1)*100))*100, 100) + '%';
    document.getElementById('welcomeText').textContent = 'Welcome Back 👋';
    document.getElementById('heroText').textContent   = 'Your profile is loading from cache.';
    document.getElementById('lessonList').innerHTML   = '<p style="color:#888">No lessons data available.</p>';
  }

  setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 600);
}

loadProfile();
</script>

</body>

</html>
